name: Sync Fujian fuel prices and publish dashboard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'index.html'
      - 'scripts/**'
      - 'data/**'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fuel-price-site
  cancel-in-progress: false
jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline parser and regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify new official notices and fetch current price
        id: sync
        continue-on-error: true
        run: python scripts/update_feed.py
      - name: Persist verified dataset in repository
        if: steps.sync.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'fuel-price-bot'
          git config user.email 'fuel-price-bot@users.noreply.github.com'
          git add data/latest.json
          if git diff --cached --quiet; then
            echo 'No changed public dataset to commit.'
          else
            git commit -m 'Update Fujian fuel prices'
            git push
          fi
      - name: Prepare minimal public site
        shell: bash
        run: |
          mkdir -p public/data
          cp index.html public/index.html
          cp data/latest.json public/data/latest.json
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test published site and data feed
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base='https://bieshuowola.github.io/today-fuel-price/'
          for attempt in range(12):
              try:
                  req=urllib.request.Request(base+'?smoke='+str(int(time.time())),headers={'Cache-Control':'no-cache','User-Agent':'FuelPricePagesSmokeTest/1.0'})
                  with urllib.request.urlopen(req,timeout=18) as resp:
                      page=resp.read().decode('utf-8')
                      if resp.status!=200 or '今日油价' not in page: raise RuntimeError('Unexpected HTML')
                  req=urllib.request.Request(base+'data/latest.json?smoke='+str(int(time.time())),headers={'Cache-Control':'no-cache','User-Agent':'FuelPricePagesSmokeTest/1.0'})
                  with urllib.request.urlopen(req,timeout=18) as resp:
                      feed=json.load(resp)
                      if resp.status!=200 or feed.get('schema')!=5 or len(feed.get('history',[]))<20:
                          raise RuntimeError('Invalid public JSON feed')
                  print('Verified public Pages URL, HTML and JSON; historical rows:',len(feed['history']))
                  break
              except Exception as exc:
                  print(f'Site propagation attempt {attempt+1}/12: {exc}')
                  if attempt==11: raise
                  time.sleep(10)
          PY
      - name: Flag failed sync without taking the previously usable website offline
        if: steps.sync.outcome == 'failure'
        run: |
          echo 'Official sync failed. Previous data was published unchanged and will show an expired status.'
          exit 1
# Publish retry after GitHub Pages was enabled; preserve the hourly sync schedule.
