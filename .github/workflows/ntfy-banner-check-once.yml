name: One-time ntfy high-priority banner check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ntfy-banner-check-once.yml'
permissions:
  contents: read
jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send one high priority ntfy test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          python - <<'PY'
          import os, json, urllib.request
          topic = os.environ.get("NTFY_TOPIC", "")
          if not topic:
              raise SystemExit("NTFY_TOPIC is missing")
          payload = {
              "topic": topic,
              "title": "今日油价 · 横幅测试",
              "message": "【测试通知】本次使用高优先级，检查手机是否显示横幅；非真实油价调整。",
              "priority": 4,
              "click": "https://bieshuowola.github.io/today-fuel-price/"
          }
          req=urllib.request.Request(
              "https://ntfy.sh/",
              data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type":"application/json; charset=utf-8"},
              method="POST")
          with urllib.request.urlopen(req,timeout=18) as resp:
              ack=json.load(resp)
              if resp.status!=200 or ack.get("topic")!=topic or ack.get("event")!="message" or not ack.get("id"):
                  raise SystemExit("Server did not acknowledge ntfy test")
              print("ntfy acknowledged banner test message ID:",ack["id"])
          PY
