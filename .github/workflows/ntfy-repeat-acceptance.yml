name: One-time ntfy repeat acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ntfy-repeat-acceptance.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send one clearly labeled test notification to current configured topic
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          python - <<'PY'
          import os, json, urllib.request
          topic = os.environ.get("NTFY_TOPIC", "")
          if not topic:
              raise SystemExit("NTFY_TOPIC is missing")
          payload = {
              "topic": topic,
              "title": "今日油价 · 二次推送测试",
              "message": "【测试通知】新 ntfy 主题第二次推送验收；不是实际油价调整，无需操作。",
              "priority": 3,
              "click": "https://bieshuowola.github.io/today-fuel-price/"
          }
          req = urllib.request.Request(
              "https://ntfy.sh/",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST")
          with urllib.request.urlopen(req, timeout=18) as resp:
              answer = json.load(resp)
              if resp.status != 200 or answer.get("event") != "message" or answer.get("topic") != topic or not answer.get("id"):
                  raise SystemExit("ntfy did not acknowledge the message")
              print("Repeat notification accepted; id:", answer["id"])
          PY
