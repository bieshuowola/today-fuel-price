name: One-time waterdrop icon notification validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/icon-check-once.yml'
permissions:
  contents: read
jobs:
  icon-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PNG URL and send one clearly labelled test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.request
          from scripts.notify_prices import ICON_URL, publish
          topic=os.environ.get('NTFY_TOPIC')
          if not topic:
              raise RuntimeError('NTFY_TOPIC is missing, refusing to send')
          request=urllib.request.Request(ICON_URL,headers={'User-Agent':'FuelPriceIconCheck/1.0'})
          with urllib.request.urlopen(request,timeout=18) as response:
              content=response.read(300000)
              if response.status != 200 or not content.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise RuntimeError('Public waterdrop icon URL is not a valid PNG')
              print('Verified public icon PNG, bytes:',len(content))
          message='【水滴图标测试｜非真实油价调整】\n通知左侧应显示「今日油价」网站的水滴图标。\n测试编号：'+os.environ['TEST_RUN']
          identifier=publish(topic, {'title':'今日油价 · 水滴图标验收',
                                      'message':message, 'priority':4})
          print('ntfy accepted icon notification:',identifier)
          PY
