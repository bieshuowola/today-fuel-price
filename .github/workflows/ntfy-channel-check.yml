name: One-time production push channel acceptance test
on:
  push:
    paths:
      - '.github/workflows/ntfy-channel-check.yml'
permissions:
  contents: read
jobs:
  notify-once:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify GitHub Secret and send one clearly marked test message
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          topic=os.environ.get('NTFY_TOPIC','')
          if not topic:
              raise RuntimeError('NTFY_TOPIC secret is missing or blank')
          payload={
            'topic': topic,
            'title': '今日油价 · 推送通道验收',
            'message': '【正式通道测试｜非真实调价】\nGitHub Actions 已读取订阅配置，正在验证手机接收。\n编号：'+os.environ['GITHUB_RUN_ID'],
            'priority': 4,
            'click': 'https://bieshuowola.github.io/today-fuel-price/'
          }
          request=urllib.request.Request(
              'https://ntfy.sh/',
              data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),
              headers={'Content-Type':'application/json; charset=utf-8',
                       'User-Agent':'NingdeFuelChannelCheck/1.0'},
              method='POST')
          with urllib.request.urlopen(request,timeout=20) as response:
              ack=json.load(response)
              if response.status != 200 or ack.get('event')!='message' or ack.get('topic')!=topic or not ack.get('id'):
                  raise RuntimeError('ntfy publish not acknowledged')
              print('ntfy accepted production secret channel test id:',ack['id'])
          PY
