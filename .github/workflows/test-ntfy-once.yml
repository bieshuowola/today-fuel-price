name: One-off ntfy notification delivery test
on:
  push:
    paths:
      - '.github/workflows/test-ntfy-once.yml'
permissions:
  contents: read
jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send exactly one example notification
        env:
          NTFY_TOPIC: ningde-fuel-n8K4v7Q2m9T6x3L5pR
        run: |
          python - <<'PY'
          import json,os,urllib.request
          payload={
            "topic":os.environ["NTFY_TOPIC"],
            "title":"今日油价 · 油价上调",
            "message":"【测试通知】新一轮油价调整已公布\n92号：8.88元/升（↑0.31元）\n95号：9.49元/升（↑0.34元）\n10月30日00:00起生效\n演示数据，非真实调价",
            "priority":3,
            "click":"https://bieshuowola.github.io/today-fuel-price/"
          }
          req=urllib.request.Request("https://ntfy.sh/",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json","User-Agent":"NingdeFuelTest/1.0"},method="POST")
          with urllib.request.urlopen(req,timeout=18) as res:
              data=json.load(res)
              if res.status!=200 or data.get("event")!="message" or data.get("topic")!=payload["topic"] or not data.get("id"):
                  raise RuntimeError("Unexpected ntfy publish response")
              print("ntfy accepted test message id:",data["id"])
          PY
